spring.application.name=taskflow-api


# # Enables the H2 console, which is a UI for the H2 database.
# spring.h2.console.enabled=true
# # The URL path to the H2 console.
# spring.h2.console.path=/h2
# # The JDBC URL for the H2 database.
# spring.datasource.url=jdbc:h2:mem:simple-crm

# # PostgreSQL
# spring.datasource.url=jdbc:postgresql://localhost:5432/taskflowapi
# # For WSL use: postgres
# # For Mac use: your Mac username
# spring.datasource.username=postgres
# # Leave blank if authentication is set to trust in pg_hba.conf
# spring.datasource.password=qwerty11

# Database connection - values come from docker-compose.yml (Part 3)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA configuration - create or update the customer table automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Server configuration
server.port=8080

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.openai.chat.model=openrouter/free
spring.ai.openai.embedding.model=nvidia/llama-nemotron-embed-vl-1b-v2:free
spring.ai.openai.embedding.encoding-format=float